services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: jwp
      POSTGRES_USER: jwp
      POSTGRES_PASSWORD: jwp_local
    ports:
      - "127.0.0.1:${JWP_PG_PORT:-55432}:5432"
    volumes:
      - jwp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jwp -d jwp"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  jwp_pg_data:
